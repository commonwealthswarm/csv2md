name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run test.sh
        run: |
          if [ -f test.sh ]; then
            bash test.sh
          else
            echo "No test.sh yet. Passing until the project adds tests."
          fi
